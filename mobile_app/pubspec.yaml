name: myapp
description: "Ecommerce MVP mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  go_router: ^14.2.0
  dio: ^5.7.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^19.4.0
  fl_chart: ^0.69.0
  flutter_secure_storage: ^9.2.0
  intl: ^0.19.0
  uuid: ^4.0.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#0A1033"
  adaptive_icon_foreground: "assets/app_logo.png"
