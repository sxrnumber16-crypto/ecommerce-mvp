name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold missing Android platform files (if absent)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name myapp --org com.example .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --dart-define API_BASE_URL=https://ecommerce-mvp-production-f5e8.up.railway.app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
