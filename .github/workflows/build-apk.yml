name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold missing Android platform files (if absent)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name myapp --org com.example .
          fi

      - name: Place google-services.json
        run: |
          cp google-services.json android/app/google-services.json
          test -f android/app/google-services.json
          ls -l android/app/google-services.json

      - name: Apply Google Services plugin
        run: |
          echo "=== gradle shape ==="
          ls -l android/settings.gradle* android/app/build.gradle*
          echo "=== settings content ==="
          cat android/settings.gradle*
          echo "=== app build content ==="
          cat android/app/build.gradle*
          python3 - <<'EOF'
          import glob

          GMS_VERSION = "4.4.2"

          def patch(path, kind):
              with open(path) as f:
                  src = f.read()
              if "com.google.gms.google-services" in src:
                  print(f"{path}: already patched")
                  return src
              # Settings files: declare the versioned plugin ONCE (apply false).
              # The plugin itself is applied in the app module only — adding
              # an unversioned id here too would double-request it in KTS
              # scaffolds (single top-level plugins block) and fail the build.
              if kind == "settings-groovy":
                  old = 'id "com.android.application" version "'
                  assert old in src, f"{path}: unexpected Groovy settings shape"
                  src = src.replace(
                      old,
                      f'id "com.google.gms.google-services" version "{GMS_VERSION}" apply false\n        id "com.android.application" version "',
                      1,
                  )
              elif kind == "settings-kts":
                  old = 'id("com.android.application") version "'
                  assert old in src, f"{path}: unexpected KTS settings shape"
                  src = src.replace(
                      old,
                      f'id("com.google.gms.google-services") version "{GMS_VERSION}" apply false\n        id("com.android.application") version "',
                      1,
                  )
              elif kind == "app-groovy":
                  lines = src.splitlines(keepends=True)
                  out, in_plugins, done = [], False, False
                  for i, line in enumerate(lines):
                      out.append(line)
                      if not in_plugins and line.strip() == "plugins {":
                          in_plugins = True
                      elif in_plugins and line.strip() == "}":
                          out.insert(len(out) - 1, '    id "com.google.gms.google-services"\n')
                          in_plugins, done = False, True
                  assert done, f"{path}: plugins block not found"
                  src = "".join(out)
              elif kind == "app-kts":
                  lines = src.splitlines(keepends=True)
                  out, in_plugins, done = [], False, False
                  for i, line in enumerate(lines):
                      out.append(line)
                      if not in_plugins and line.strip() == "plugins {":
                          in_plugins = True
                      elif in_plugins and line.strip() == "}":
                          out.insert(len(out) - 1, '    id("com.google.gms.google-services")\n')
                          in_plugins, done = False, True
                  assert done, f"{path}: plugins block not found"
                  src = "".join(out)
              else:
                  raise AssertionError(f"unknown kind {kind}")
              with open(path, "w") as f:
                  f.write(src)
              print(f"{path}: patched ({kind})")
              return src

          settings = glob.glob("android/settings.gradle*")
          app_builds = glob.glob("android/app/build.gradle*")
          assert settings, "no android/settings.gradle* found"
          assert app_builds, "no android/app/build.gradle* found"
          for p in settings:
              kind = "settings-kts" if p.endswith(".kts") else "settings-groovy"
              patch(p, kind)
          for p in app_builds:
              kind = "app-kts" if p.endswith(".kts") else "app-groovy"
              patch(p, kind)
          EOF
          grep -r google-services android/settings.gradle* android/app/build.gradle* \
            || (echo "GMS plugin application FAILED" >&2; exit 1)

      - name: Ensure INTERNET permission (release builds need it explicit)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|\0\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi
          grep -c 'android.permission.INTERNET' "$MANIFEST"

      - name: Set app label to Orvix Shop
        run: |
          sed -i 's|android:label="myapp"|android:label="Orvix Shop"|' android/app/src/main/AndroidManifest.xml
          grep -c 'android:label="Orvix Shop"' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define API_BASE_URL=https://ecommerce-mvp-production-9169.up.railway.app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
